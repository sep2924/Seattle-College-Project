<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Bounce Ball</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #1a1c2c;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    touch-action: none;
    user-select: none;
  }
  #game-container {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    background: linear-gradient(180deg, #2b2f4a 0%, #1a1c2c 100%);
    max-width: 100%;
    max-height: 100%;
    touch-action: none;
  }
  #hud {
    position: absolute;
    top: 12px;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 16px;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    pointer-events: none;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    z-index: 10;
  }
  #hud .stat {
    background: rgba(0,0,0,0.35);
    border-radius: 20px;
    padding: 6px 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    pointer-events: auto;
  }
  .star-icon {
    color: #ffd24a;
    font-size: 18px;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(10, 12, 24, 0.78);
    color: #fff;
    text-align: center;
    z-index: 20;
    padding: 24px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 {
    font-size: 42px;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  #overlay h2 {
    font-size: 24px;
    margin-bottom: 16px;
  }
  #overlay p {
    font-size: 15px;
    opacity: 0.8;
    margin-bottom: 24px;
    max-width: 360px;
    line-height: 1.5;
  }
  .btn {
    background: #ffd24a;
    color: #2a2200;
    border: none;
    border-radius: 24px;
    padding: 14px 36px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    margin: 6px;
    transition: transform 0.1s ease, opacity 0.1s ease;
  }
  .btn:active { transform: scale(0.96); }
  .btn.secondary {
    background: rgba(255,255,255,0.12);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.3);
  }
  #level-select {
    display: grid;
    grid-template-columns: repeat(5, 56px);
    gap: 10px;
    margin: 16px 0 24px;
  }
  .level-btn {
    width: 56px; height: 56px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.08);
    color: #fff;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 2px;
  }
  .level-btn .stars-earned {
    font-size: 10px;
    color: #ffd24a;
  }
  .level-btn.locked {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .level-btn.completed {
    border-color: #ffd24a;
  }
  #controls-hint {
    position: absolute;
    bottom: 16px;
    left: 0;
    right: 0;
    text-align: center;
    color: rgba(255,255,255,0.55);
    font-size: 13px;
    z-index: 10;
    pointer-events: none;
  }
  #pause-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 15;
    pointer-events: auto;
  }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="hud">
    <div class="stat"><span class="star-icon">★</span><span id="star-count">0/0</span></div>
    <div class="stat" id="level-label">Stage 1</div>
    <div class="stat" id="death-count">Deaths: 0</div>
  </div>

  <div id="controls-hint">Tilt your phone, or use ← → arrow keys / A D to move. Tap and hold for boost.</div>

  <div id="overlay">
    <h1>Bounce Ball</h1>
    <p>Roll, bounce, and tilt your way through stages. Collect every star to clear each stage. One hit from a hazard and you start the stage over!</p>
    <div id="level-select"></div>
    <button class="btn secondary" id="enable-tilt-btn">Enable tilt controls</button>
  </div>
</div>

<script>
(() => {
  // ---------------------------------------------------------------
  // Setup
  // ---------------------------------------------------------------
  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const starCountEl = document.getElementById('star-count');
  const levelLabelEl = document.getElementById('level-label');
  const deathCountEl = document.getElementById('death-count');
  const levelSelectEl = document.getElementById('level-select');
  const enableTiltBtn = document.getElementById('enable-tilt-btn');

  const WORLD_W = 480;
  const WORLD_H = 800;

  function resizeCanvas() {
    const containerW = window.innerWidth;
    const containerH = window.innerHeight;
    const scale = Math.min(containerW / WORLD_W, containerH / WORLD_H);
    canvas.width = WORLD_W;
    canvas.height = WORLD_H;
    canvas.style.width = (WORLD_W * scale) + 'px';
    canvas.style.height = (WORLD_H * scale) + 'px';
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ---------------------------------------------------------------
  // Level definitions
  // Coordinates are in world units (480 x 800 per screen "stage").
  // type: 'solid' platforms, 'star' collectibles, 'spike' hazards,
  // 'goal' end marker, 'bouncepad' boosts upward.
  // ---------------------------------------------------------------
  const LEVELS = [
    // Stage 1 - intro
    {
      gravity: 0.45,
      start: { x: 60, y: 60 },
      platforms: [
        { x: 0, y: 100, w: 200, h: 20 },
        { x: 240, y: 180, w: 200, h: 20 },
        { x: 60, y: 280, w: 200, h: 20 },
        { x: 280, y: 380, w: 200, h: 20 },
        { x: 40, y: 480, w: 220, h: 20 },
        { x: 0, y: 600, w: 480, h: 30 } // floor
      ],
      stars: [
        { x: 120, y: 70 },
        { x: 320, y: 150 },
        { x: 140, y: 250 },
        { x: 360, y: 350 }
      ],
      spikes: [
        { x: 260, y: 590, w: 60, h: 10 }
      ],
      bouncepads: [],
      goal: { x: 380, y: 460, w: 60, h: 20 }
    },
    // Stage 2 - more gaps
    {
      gravity: 0.45,
      start: { x: 40, y: 60 },
      platforms: [
        { x: 0, y: 100, w: 140, h: 20 },
        { x: 200, y: 100, w: 140, h: 20 },
        { x: 360, y: 180, w: 120, h: 20 },
        { x: 160, y: 260, w: 140, h: 20 },
        { x: 0, y: 340, w: 120, h: 20 },
        { x: 200, y: 420, w: 140, h: 20 },
        { x: 360, y: 500, w: 120, h: 20 },
        { x: 80, y: 580, w: 160, h: 20 },
        { x: 0, y: 700, w: 480, h: 30 }
      ],
      stars: [
        { x: 70, y: 70 },
        { x: 420, y: 150 },
        { x: 230, y: 230 },
        { x: 60, y: 310 },
        { x: 420, y: 470 }
      ],
      spikes: [
        { x: 140, y: 690, w: 80, h: 10 },
        { x: 300, y: 690, w: 80, h: 10 }
      ],
      bouncepads: [
        { x: 110, y: 568, w: 50, h: 12 }
      ],
      goal: { x: 130, y: 555, w: 60, h: 20 }
    },
    // Stage 3 - bounce pads heavy
    {
      gravity: 0.5,
      start: { x: 220, y: 60 },
      platforms: [
        { x: 160, y: 100, w: 160, h: 20 },
        { x: 0, y: 220, w: 140, h: 20 },
        { x: 340, y: 220, w: 140, h: 20 },
        { x: 0, y: 700, w: 480, h: 30 },
        { x: 180, y: 460, w: 120, h: 20 },
        { x: 20, y: 580, w: 120, h: 20 },
        { x: 340, y: 580, w: 120, h: 20 }
      ],
      stars: [
        { x: 230, y: 70 },
        { x: 60, y: 190 },
        { x: 400, y: 190 },
        { x: 230, y: 430 },
        { x: 80, y: 550 }
      ],
      spikes: [
        { x: 0, y: 690, w: 180, h: 10 },
        { x: 300, y: 690, w: 180, h: 10 }
      ],
      bouncepads: [
        { x: 200, y: 695, w: 80, h: 12 },
        { x: 60, y: 215, w: 40, h: 10 },
        { x: 380, y: 215, w: 40, h: 10 }
      ],
      goal: { x: 380, y: 540, w: 60, h: 20 }
    },
    // Stage 4 - narrow ledges, precision
    {
      gravity: 0.48,
      start: { x: 40, y: 60 },
      platforms: [
        { x: 0, y: 100, w: 100, h: 16 },
        { x: 150, y: 160, w: 80, h: 16 },
        { x: 280, y: 100, w: 80, h: 16 },
        { x: 400, y: 200, w: 80, h: 16 },
        { x: 260, y: 280, w: 80, h: 16 },
        { x: 100, y: 340, w: 80, h: 16 },
        { x: 0, y: 420, w: 80, h: 16 },
        { x: 180, y: 460, w: 80, h: 16 },
        { x: 340, y: 420, w: 80, h: 16 },
        { x: 380, y: 560, w: 100, h: 16 },
        { x: 180, y: 600, w: 100, h: 16 },
        { x: 0, y: 700, w: 480, h: 30 }
      ],
      stars: [
        { x: 50, y: 70 },
        { x: 185, y: 130 },
        { x: 440, y: 170 },
        { x: 295, y: 250 },
        { x: 40, y: 390 },
        { x: 220, y: 430 },
        { x: 420, y: 530 }
      ],
      spikes: [
        { x: 0, y: 690, w: 480, h: 10 }
      ],
      bouncepads: [],
      goal: { x: 200, y: 570, w: 60, h: 20 }
    },
    // Stage 5 - finale, mix of everything
    {
      gravity: 0.5,
      start: { x: 220, y: 50 },
      platforms: [
        { x: 160, y: 90, w: 160, h: 16 },
        { x: 0, y: 180, w: 120, h: 16 },
        { x: 360, y: 180, w: 120, h: 16 },
        { x: 180, y: 260, w: 120, h: 16 },
        { x: 0, y: 360, w: 100, h: 16 },
        { x: 380, y: 360, w: 100, h: 16 },
        { x: 190, y: 420, w: 100, h: 16 },
        { x: 40, y: 500, w: 100, h: 16 },
        { x: 340, y: 500, w: 100, h: 16 },
        { x: 190, y: 580, w: 100, h: 16 },
        { x: 0, y: 700, w: 480, h: 30 }
      ],
      stars: [
        { x: 230, y: 60 },
        { x: 50, y: 150 },
        { x: 410, y: 150 },
        { x: 230, y: 230 },
        { x: 40, y: 330 },
        { x: 420, y: 330 },
        { x: 230, y: 390 },
        { x: 80, y: 470 },
        { x: 380, y: 470 }
      ],
      spikes: [
        { x: 120, y: 690, w: 100, h: 10 },
        { x: 260, y: 690, w: 100, h: 10 }
      ],
      bouncepads: [
        { x: 220, y: 695, w: 40, h: 10 },
        { x: 210, y: 585, w: 60, h: 10 }
      ],
      goal: { x: 210, y: 620, w: 60, h: 20 }
    }
  ];

  // ---------------------------------------------------------------
  // Game state
  // ---------------------------------------------------------------
  const BALL_RADIUS = 12;

  let currentLevelIndex = 0;
  let progress = JSON.parse(localStorage_safe_get());

  function localStorage_safe_get() {
    try {
      const raw = window.localStorage && window.localStorage.getItem('bounceball_progress');
      if (raw) return raw;
    } catch (e) {}
    return JSON.stringify({ unlocked: 1, stars: {} });
  }
  function saveProgress() {
    try {
      if (window.localStorage) {
        window.localStorage.setItem('bounceball_progress', JSON.stringify(progress));
      }
    } catch (e) {}
  }

  let ball, level, deaths, collected, gameRunning, won;
  let tiltX = 0;
  let keys = { left: false, right: false };
  let pointerActive = false;
  let pointerSide = 0; // -1 left, 1 right, 0 none

  function loadLevel(index) {
    currentLevelIndex = index;
    level = LEVELS[index];
    ball = {
      x: level.start.x,
      y: level.start.y,
      vx: 0,
      vy: 0,
      r: BALL_RADIUS
    };
    deaths = 0;
    collected = new Array(level.stars.length).fill(false);
    gameRunning = true;
    won = false;
    updateHUD();
    levelLabelEl.textContent = 'Stage ' + (index + 1);
  }

  function resetBall() {
    ball.x = level.start.x;
    ball.y = level.start.y;
    ball.vx = 0;
    ball.vy = 0;
    deaths++;
    collected = new Array(level.stars.length).fill(false);
    updateHUD();
  }

  function updateHUD() {
    const total = level.stars.length;
    const got = collected.filter(Boolean).length;
    starCountEl.textContent = got + '/' + total;
    deathCountEl.textContent = 'Deaths: ' + deaths;
  }

  // ---------------------------------------------------------------
  // Input
  // ---------------------------------------------------------------
  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
    if (e.key === 'r' || e.key === 'R') resetBall();
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
  });

  // Touch / pointer: tap left half or right half of screen to move that direction
  canvas.addEventListener('pointerdown', (e) => {
    pointerActive = true;
    const rect = canvas.getBoundingClientRect();
    const relX = (e.clientX - rect.left) / rect.width;
    pointerSide = relX < 0.5 ? -1 : 1;
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!pointerActive) return;
    const rect = canvas.getBoundingClientRect();
    const relX = (e.clientX - rect.left) / rect.width;
    pointerSide = relX < 0.5 ? -1 : 1;
  });
  window.addEventListener('pointerup', () => { pointerActive = false; pointerSide = 0; });
  window.addEventListener('pointercancel', () => { pointerActive = false; pointerSide = 0; });

  // Device tilt
  let tiltEnabled = false;
  function handleOrientation(e) {
    // gamma: left-right tilt, range roughly -90 to 90
    if (e.gamma === null) return;
    tiltX = Math.max(-1, Math.min(1, e.gamma / 30));
  }
  enableTiltBtn.addEventListener('click', () => {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(state => {
        if (state === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation);
          tiltEnabled = true;
          enableTiltBtn.textContent = 'Tilt enabled';
          enableTiltBtn.disabled = true;
        }
      }).catch(() => {});
    } else if (typeof DeviceOrientationEvent !== 'undefined') {
      window.addEventListener('deviceorientation', handleOrientation);
      tiltEnabled = true;
      enableTiltBtn.textContent = 'Tilt enabled';
      enableTiltBtn.disabled = true;
    } else {
      enableTiltBtn.textContent = 'Tilt not supported';
      enableTiltBtn.disabled = true;
    }
  });

  // ---------------------------------------------------------------
  // Physics & collision
  // ---------------------------------------------------------------
  const MOVE_ACCEL = 0.6;
  const MAX_VX = 6;
  const FRICTION = 0.98;
  const BOUNCEPAD_VELOCITY = -11;

  function circleRectCollision(cx, cy, r, rx, ry, rw, rh) {
    const closestX = Math.max(rx, Math.min(cx, rx + rw));
    const closestY = Math.max(ry, Math.min(cy, ry + rh));
    const dx = cx - closestX;
    const dy = cy - closestY;
    return (dx * dx + dy * dy) < (r * r);
  }

  function resolveCollision(ball, rect) {
    // Determine overlap on each axis to find shallowest resolution
    const closestX = Math.max(rect.x, Math.min(ball.x, rect.x + rect.w));
    const closestY = Math.max(rect.y, Math.min(ball.y, rect.y + rect.h));
    let dx = ball.x - closestX;
    let dy = ball.y - closestY;
    let dist = Math.sqrt(dx*dx + dy*dy);
    if (dist === 0) {
      // ball center inside rect - push out upward
      dy = -1; dist = 1;
    }
    const overlap = ball.r - dist;
    if (overlap > 0) {
      const nx = dx / dist;
      const ny = dy / dist;
      ball.x += nx * overlap;
      ball.y += ny * overlap;
      // Reflect velocity along normal with NO energy loss - always bounces
      const dot = ball.vx * nx + ball.vy * ny;
      if (dot < 0) {
        ball.vx -= 2 * dot * nx;
        ball.vy -= 2 * dot * ny;
        // Ensure a minimum bounce so the ball never goes fully dead on a surface
        const minBounce = 3;
        if (Math.abs(ny) > 0.5 && ball.vy > -minBounce && ball.vy < 0) {
          ball.vy = -minBounce;
        }
      }
      return ny; // return normal y to detect "landed on top"
    }
    return null;
  }

  function update() {
    if (!gameRunning || won) return;

    // Input
    let moveDir = 0;
    if (keys.left) moveDir -= 1;
    if (keys.right) moveDir += 1;
    if (pointerActive) moveDir += pointerSide;
    if (tiltEnabled) moveDir += tiltX;
    moveDir = Math.max(-1, Math.min(1, moveDir));

    ball.vx += moveDir * MOVE_ACCEL;
    ball.vx *= FRICTION;
    ball.vx = Math.max(-MAX_VX, Math.min(MAX_VX, ball.vx));

    ball.vy += level.gravity;
    ball.vy = Math.min(ball.vy, 18);

    ball.x += ball.vx;
    ball.y += ball.vy;

    // World bounds (side walls)
    if (ball.x - ball.r < 0) { ball.x = ball.r; ball.vx *= -1; }
    if (ball.x + ball.r > WORLD_W) { ball.x = WORLD_W - ball.r; ball.vx *= -1; }
    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.vy *= -1; }

    // Fall off bottom = death
    if (ball.y - ball.r > WORLD_H + 20) {
      resetBall();
      return;
    }

    // Platform collisions
    for (const p of level.platforms) {
      resolveCollision(ball, p);
    }

    // Bounce pads
    for (const bp of level.bouncepads) {
      if (circleRectCollision(ball.x, ball.y, ball.r, bp.x, bp.y, bp.w, bp.h)) {
        if (ball.vy > 0) {
          ball.vy = BOUNCEPAD_VELOCITY;
          ball.y = bp.y - ball.r;
        }
      }
    }

    // Spikes = death
    for (const s of level.spikes) {
      if (circleRectCollision(ball.x, ball.y, ball.r, s.x, s.y, s.w, s.h)) {
        resetBall();
        return;
      }
    }

    // Stars
    level.stars.forEach((star, i) => {
      if (collected[i]) return;
      const dx = ball.x - star.x;
      const dy = ball.y - star.y;
      if (Math.sqrt(dx*dx + dy*dy) < ball.r + 10) {
        collected[i] = true;
        updateHUD();
      }
    });

    // Goal
    const g = level.goal;
    if (circleRectCollision(ball.x, ball.y, ball.r, g.x, g.y, g.w, g.h)) {
      const allStars = collected.every(Boolean);
      if (allStars) {
        won = true;
        onLevelComplete();
      }
    }
  }

  function onLevelComplete() {
    const starsGot = collected.filter(Boolean).length;
    progress.stars[currentLevelIndex] = Math.max(progress.stars[currentLevelIndex] || 0, starsGot);
    if (currentLevelIndex + 1 >= progress.unlocked) {
      progress.unlocked = Math.min(LEVELS.length, currentLevelIndex + 2);
    }
    saveProgress();

    setTimeout(() => {
      showWinOverlay();
    }, 400);
  }

  function showWinOverlay() {
    gameRunning = false;
    overlay.classList.remove('hidden');
    overlay.innerHTML = '';

    const h1 = document.createElement('h1');
    h1.textContent = 'Stage clear!';
    overlay.appendChild(h1);

    const h2 = document.createElement('h2');
    h2.textContent = 'Stage ' + (currentLevelIndex + 1) + ' complete';
    overlay.appendChild(h2);

    const p = document.createElement('p');
    p.textContent = 'Deaths this run: ' + deaths;
    overlay.appendChild(p);

    const btnRow = document.createElement('div');

    if (currentLevelIndex + 1 < LEVELS.length) {
      const nextBtn = document.createElement('button');
      nextBtn.className = 'btn';
      nextBtn.textContent = 'Next stage';
      nextBtn.addEventListener('click', () => {
        overlay.classList.add('hidden');
        loadLevel(currentLevelIndex + 1);
      });
      btnRow.appendChild(nextBtn);
    } else {
      const doneMsg = document.createElement('p');
      doneMsg.textContent = "You've cleared all stages!";
      overlay.appendChild(doneMsg);
    }

    const menuBtn = document.createElement('button');
    menuBtn.className = 'btn secondary';
    menuBtn.textContent = 'Stage select';
    menuBtn.addEventListener('click', () => {
      buildLevelSelect();
      overlay.classList.remove('hidden');
    });
    btnRow.appendChild(menuBtn);

    overlay.appendChild(btnRow);
  }

  // ---------------------------------------------------------------
  // Rendering
  // ---------------------------------------------------------------
  function draw() {
    ctx.clearRect(0, 0, WORLD_W, WORLD_H);

    // Background grid dots for depth
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    for (let gx = 0; gx < WORLD_W; gx += 40) {
      for (let gy = 0; gy < WORLD_H; gy += 40) {
        ctx.fillRect(gx, gy, 2, 2);
      }
    }

    // Platforms
    ctx.fillStyle = '#4a5078';
    ctx.strokeStyle = '#6f7aad';
    ctx.lineWidth = 2;
    for (const p of level.platforms) {
      roundRect(ctx, p.x, p.y, p.w, p.h, 4);
      ctx.fill();
      ctx.stroke();
    }

    // Bounce pads
    ctx.fillStyle = '#3ad6c1';
    for (const bp of level.bouncepads) {
      roundRect(ctx, bp.x, bp.y, bp.w, bp.h, 4);
      ctx.fill();
    }

    // Spikes
    ctx.fillStyle = '#ff5d5d';
    for (const s of level.spikes) {
      drawSpikes(ctx, s.x, s.y, s.w, s.h);
    }

    // Goal flag
    const g = level.goal;
    ctx.fillStyle = won ? '#7CFC00' : '#ffd24a';
    roundRect(ctx, g.x, g.y, g.w, g.h, 4);
    ctx.fill();
    ctx.fillStyle = '#2a2200';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('GOAL', g.x + g.w/2, g.y + g.h/2 + 4);

    // Stars
    level.stars.forEach((star, i) => {
      if (collected[i]) return;
      drawStar(ctx, star.x, star.y, 10, '#ffd24a');
    });

    // Ball
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(ball.x - 4, ball.y - 4, 2, ball.x, ball.y, ball.r);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(1, '#ff7a59');
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = '#c2462f';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawSpikes(ctx, x, y, w, h) {
    const spikeWidth = 14;
    const count = Math.max(1, Math.round(w / spikeWidth));
    const actualW = w / count;
    for (let i = 0; i < count; i++) {
      const sx = x + i * actualW;
      ctx.beginPath();
      ctx.moveTo(sx, y + h);
      ctx.lineTo(sx + actualW / 2, y);
      ctx.lineTo(sx + actualW, y + h);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawStar(ctx, cx, cy, r, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = (Math.PI * 2 * i) / 5 - Math.PI / 2;
      const outerX = Math.cos(angle) * r;
      const outerY = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(outerX, outerY);
      else ctx.lineTo(outerX, outerY);
      const innerAngle = angle + Math.PI / 5;
      const innerX = Math.cos(innerAngle) * r * 0.45;
      const innerY = Math.sin(innerAngle) * r * 0.45;
      ctx.lineTo(innerX, innerY);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.shadowColor = color;
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.restore();
  }

  // ---------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  // ---------------------------------------------------------------
  // Level select UI
  // ---------------------------------------------------------------
  function buildLevelSelect() {
    overlay.innerHTML = '';
    const h1 = document.createElement('h1');
    h1.textContent = 'Bounce Ball';
    overlay.appendChild(h1);

    const p = document.createElement('p');
    p.textContent = 'Roll, bounce, and tilt your way through stages. Collect every star and reach the goal to clear each stage.';
    overlay.appendChild(p);

    const grid = document.createElement('div');
    grid.id = 'level-select';
    LEVELS.forEach((lvl, i) => {
      const btn = document.createElement('button');
      const unlocked = i < progress.unlocked;
      btn.className = 'level-btn' + (unlocked ? '' : ' locked');
      if (progress.stars[i] !== undefined) btn.classList.add('completed');

      const num = document.createElement('div');
      num.textContent = (i + 1);
      btn.appendChild(num);

      if (progress.stars[i] !== undefined) {
        const starsEarned = document.createElement('div');
        starsEarned.className = 'stars-earned';
        starsEarned.textContent = '★ ' + progress.stars[i] + '/' + lvl.stars.length;
        btn.appendChild(starsEarned);
      }

      if (unlocked) {
        btn.addEventListener('click', () => {
          overlay.classList.add('hidden');
          loadLevel(i);
        });
      }
      grid.appendChild(btn);
    });
    overlay.appendChild(grid);

    const btnRow = document.createElement('div');
    const tiltBtn = document.createElement('button');
    tiltBtn.className = 'btn secondary';
    tiltBtn.id = 'enable-tilt-btn';
    tiltBtn.textContent = tiltEnabled ? 'Tilt enabled' : 'Enable tilt controls';
    if (tiltEnabled) tiltBtn.disabled = true;
    tiltBtn.addEventListener('click', enableTiltHandler);
    btnRow.appendChild(tiltBtn);
    overlay.appendChild(btnRow);
  }

  function enableTiltHandler() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      DeviceOrientationEvent.requestPermission().then(state => {
        if (state === 'granted') {
          window.addEventListener('deviceorientation', handleOrientation);
          tiltEnabled = true;
          const b = document.getElementById('enable-tilt-btn');
          if (b) { b.textContent = 'Tilt enabled'; b.disabled = true; }
        }
      }).catch(() => {});
    } else if (typeof DeviceOrientationEvent !== 'undefined') {
      window.addEventListener('deviceorientation', handleOrientation);
      tiltEnabled = true;
      const b = document.getElementById('enable-tilt-btn');
      if (b) { b.textContent = 'Tilt enabled'; b.disabled = true; }
    } else {
      const b = document.getElementById('enable-tilt-btn');
      if (b) { b.textContent = 'Tilt not supported'; b.disabled = true; }
    }
  }

  // ---------------------------------------------------------------
  // Boot
  // ---------------------------------------------------------------
  buildLevelSelect();
  loadLevel(0); // preload level 0 so canvas isn't blank behind overlay
  gameRunning = false; // don't run physics until a level is chosen
  // Override: re-enable when a stage is picked via loadLevel (it sets gameRunning=true)
  draw();
  loop();
})();
</script>
</body>
</html>
